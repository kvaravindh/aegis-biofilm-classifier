name: Retrain model and publish site

on:
  push:
    branches: [main]
    paths:
      - "training/**"
      - "*.py"
      - "scripts/**"
      - "site/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: train-and-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model on the training photos
        run: python scripts/train.py

      - name: Save the new model to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/
          if ! git diff --cached --quiet; then
            git commit -m "Retrain model on current training set [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build site
        run: python site/build_site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
